    }

    function renderIframe(page) {
      inlineWrap.hidden = true;
      iframeWrap.hidden = false;
      frame.removeAttribute('srcdoc');
      frame.src = page.src;
    }

    function updateToc(activeId) {
      document.querySelectorAll('.toc-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === activeId);
      });
    }

    function goToPage(id) {
      const page = pageMap.get(id);
      if (!page) return;
      const index = page._index;
      history.replaceState(null, '', `#${encodeURIComponent(id)}`);

      sectionNameEl.textContent = page.section;
      pageTitleEl.textContent = page.label;
      pageIndexEl.textContent = String(index + 1);
      footerPageText.textContent = `第 ${index + 1} 页 / 共 ${pages.length} 页`;

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === pages.length - 1;
      prevBtn.dataset.target = index > 0 ? pages[index - 1].id : '';
      nextBtn.dataset.target = index < pages.length - 1 ? pages[index + 1].id : '';

      if (page.kind === 'iframe') renderIframe(page);
      else renderInline(page);
      updateToc(id);
    }

    prevBtn.addEventListener('click', () => {
      if (prevBtn.dataset.target) goToPage(prevBtn.dataset.target);
    });
    nextBtn.addEventListener('click', () => {
      if (nextBtn.dataset.target) goToPage(nextBtn.dataset.target);
    });
    window.addEventListener('hashchange', () => goToPage(initialPageId()));

    buildToc();
    goToPage(initialPageId());
  </script>
</body>
</html>
