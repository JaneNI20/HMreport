<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02_人群细分_6大人群</title>
  <style>
:root {
      --bg: #edf2f7;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --line: #d8e2ec;
      --line-strong: #bfd0e1;
      --text: #17283b;
      --muted: #536b82;
      --brand: #2f6fa3;
      --brand-dark: #224f77;
      --brand-soft: #e8f2fb;
      --shadow: 0 16px 44px rgba(23, 40, 59, 0.10);
      --sidebar: 284px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    .sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; padding: 22px 14px; background: #162233; border-right: 1px solid #26384d; }
    .brandbox { padding: 18px 15px; margin-bottom: 14px; border: 1px solid #2d4056; border-radius: 8px; background: #1d2d42; box-shadow: 0 14px 32px rgba(0, 0, 0, .18); }
    .kicker { margin-bottom: 10px; font-size: 12px; color: #7b93aa; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .brandbox h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.18; color: #f4f8fc; letter-spacing: 0; }
    .brandbox p { margin: 0; color: #bac9d6; font-size: 13px; line-height: 1.62; }
    .toc { display: grid; gap: 10px; }
    .toc-group { padding: 8px; border: 1px solid #2b3f55; border-radius: 8px; background: #1b2a3d; }
    .toc-title { padding: 7px 8px 8px; color: #b8c8d7; font-size: 12px; line-height: 1.35; font-weight: 700; }
    .toc-list { display: grid; gap: 5px; }
    .toc-btn { width: 100%; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #e4edf6; text-align: left; cursor: pointer; padding: 8px 9px; font-size: 13px; line-height: 1.38; }
    .toc-btn:hover { background: #22354b; border-color: #38516c; }
    .toc-btn.active { background: #2b5b86; border-color: #4b7fab; color: #ffffff; }
    .toc-btn .meta { display: block; margin-bottom: 2px; font-size: 11px; color: #91a8ba; font-weight: 800; }
    .toc-btn.active .meta { color: #d6e9fb; }
    .main { min-width: 0; padding: 24px 26px 22px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 16px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .title-wrap small { display: block; margin-bottom: 6px; color: #738ba0; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .title-wrap h2 { margin: 0; color: var(--brand-dark); font-size: 28px; line-height: 1.22; letter-spacing: 0; }
    .pagerbox { min-width: 226px; display: grid; justify-items: end; gap: 10px; }
    .page-indicator { color: #547086; font-weight: 700; }
    .page-indicator strong { color: var(--brand-dark); font-size: 22px; }
    .nav-actions { display: flex; gap: 10px; }
    .nav-actions button { border: 1px solid var(--line-strong); background: var(--panel-soft); color: var(--brand-dark); border-radius: 6px; padding: 9px 13px; cursor: pointer; font-weight: 800; }
    .nav-actions button:hover { background: #edf5fc; }
    .nav-actions button:disabled { opacity: .42; cursor: not-allowed; }
    .content-shell { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .iframe-wrap { width: 100%; height: calc(100vh - 154px); min-height: 760px; background: #f7fbff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #f7fbff; }
    .inline-wrap { min-height: calc(100vh - 154px); padding: 30px; background: linear-gradient(180deg, #f8fbff 0%, #eef3f8 100%); }
    .slide { max-width: 1180px; margin: 0 auto; padding: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .slide h1 { margin: 0 0 12px; color: var(--brand-dark); font-size: 38px; line-height: 1.18; letter-spacing: 0; }
    .lead { max-width: 980px; margin: 0 0 24px; color: #4f687d; font-size: 17px; line-height: 1.76; }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card, .jump-card, .sku-card { padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, #fff 0%, #f8fbff 100%); box-shadow: 0 10px 24px rgba(23, 40, 59, .06); }
    .card h3, .sku-card h3 { margin: 0 0 12px; color: var(--brand-dark); font-size: 22px; }
    .card ul { margin: 0; padding-left: 20px; color: #4f687d; font-size: 15px; line-height: 1.75; }
    .card.emphasis { background: #f5f9fd; border-color: #cbdced; }
    .jump-card { color: inherit; text-align: left; cursor: pointer; transition: .18s ease; }
    .jump-card:hover { transform: translateY(-2px); border-color: #b9d2e8; background: #f3f8fd; }
    .jump-card span { display: block; margin-bottom: 9px; color: #71879c; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .jump-card strong { display: block; margin-bottom: 8px; color: var(--brand-dark); font-size: 21px; line-height: 1.35; }
    .jump-card small { display: block; color: #5c7389; font-size: 14px; line-height: 1.6; }
    .cover-slide { background: radial-gradient(circle at top right, rgba(47,111,163,.10), transparent 26%), linear-gradient(135deg, #ffffff 0%, #f8fbff 62%, #eef4f9 100%); }
    .cover-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 22px; }
    .cover-badge { min-width: 140px; padding: 17px 14px; border: 1px solid #cbdceb; border-radius: 8px; background: #f0f7fd; text-align: center; color: var(--brand-dark); }
    .cover-badge strong { display: block; margin-bottom: 7px; font-size: 32px; line-height: 1; }
    .cover-badge span { color: #5b7288; font-size: 14px; font-weight: 800; }
    .cover-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .home-footer-note { margin-top: 12px; padding: 8px 0 0; border-top: 1px solid var(--line); color: #8a9aaa; font-size: 12px; line-height: 1.45; display: flex; justify-content: flex-end; text-align: right; }
    .sku-kicker { display: inline-flex; margin-bottom: 14px; padding: 7px 11px; border: 1px solid #d5e3f0; border-radius: 999px; background: #edf5fc; color: #4b6985; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .sku-placeholder { min-height: 240px; padding: 20px; display: grid; align-content: center; gap: 10px; border: 1.5px dashed #c5d7e7; border-radius: 8px; background: #fbfdff; color: #60788d; font-size: 15px; line-height: 1.75; }
    .sku-placeholder p { margin: 0; }
    .footerbar { display: flex; justify-content: space-between; gap: 14px; margin-top: 14px; padding: 0 4px; color: #627c91; font-size: 13px; }
    @media (max-width: 1380px) {
      :root { --sidebar: 260px; }
      .grid.three, .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cover-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .main { padding-top: 0; }
      .topbar, .cover-top, .footerbar { flex-direction: column; align-items: flex-start; }
      .pagerbox { justify-items: start; min-width: 0; }
      .grid.two, .grid.three, .quick-grid { grid-template-columns: 1fr; }
      .iframe-wrap { height: 78vh; min-height: 680px; }
    }
  
    /* v26 Visual Polish: executive report baseline */
    :root {
      --bg: #f2f5f8;
      --panel: #ffffff;
      --panel-soft: #f7f9fc;
      --line: #d8e1ea;
      --line-strong: #bccbd8;
      --text: #17283b;
      --muted: #53687a;
      --brand: #2f6f9f;
      --brand-dark: #1f4f73;
      --brand-soft: #eaf3fa;
      --accent: #6f8f9f;
      --highlight: #b7791f;
      --shadow: 0 12px 30px rgba(23, 40, 59, 0.08);
    }
    html, body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      text-rendering: geometricPrecision;
    }
    .sidebar { background: #172638; border-right-color: #26384a; }
    .brandbox { border-radius: 8px; background: #1d2d40; border-color: #31465d; box-shadow: 0 12px 28px rgba(0,0,0,.16); }
    .brandbox h1 { font-size: 23px; letter-spacing: 0; }
    .kicker {
      color: #6f879b;
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .topbar {
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(23, 40, 59, .07);
    }
    .title-wrap h2 { font-size: 27px; color: var(--brand-dark); letter-spacing: 0; }
    .page-indicator, .footerbar { color: #5d7284; }
    .toc-group { border-radius: 8px; background: #1c2b3d; border-color: #2e4358; }
    .toc-title { color: #b9c9d7; letter-spacing: 0; }
    .toc-btn { border-radius: 6px; font-size: 13px; line-height: 1.42; }
    .toc-btn.active { background: #2c648f; border-color: #4f84ad; }
    .content-shell, .slide, .card, .jump-card, .sku-card, .cover-badge {
      border-radius: 8px;
    }
    .content-shell { border-color: var(--line); box-shadow: var(--shadow); }
    .inline-wrap { padding: 28px; background: linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%); }
    .slide {
      max-width: 1180px;
      padding: 32px 34px;
      border-color: var(--line);
      box-shadow: 0 12px 30px rgba(23, 40, 59, .08);
    }
    .slide h1 {
      margin-bottom: 12px;
      color: var(--brand-dark);
      font-size: 36px;
      line-height: 1.16;
      letter-spacing: 0;
      font-weight: 800;
    }
    .lead {
      max-width: 1000px;
      color: #4f6476;
      font-size: 16px;
      line-height: 1.72;
    }
    .grid { gap: 16px; }
    .card, .jump-card, .sku-card {
      padding: 20px;
      border-color: var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f9fbfd 100%);
      box-shadow: 0 8px 18px rgba(23, 40, 59, .055);
    }
    .card.emphasis {
      background: #f3f8fc;
      border-color: #bfd3e4;
      box-shadow: 0 8px 20px rgba(47, 111, 159, .08);
    }
    .card h3, .sku-card h3 {
      color: var(--brand-dark);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
    }
    .card ul, .sku-card p, .card p {
      color: #4f6476;
      font-size: 14.5px;
      line-height: 1.72;
    }
    .card li + li { margin-top: 3px; }
    strong { color: #20384e; font-weight: 800; }
    table {
      border-collapse: collapse;
      border-spacing: 0;
    }
    th {
      background: #f3f7fb;
      color: var(--brand-dark) !important;
      font-weight: 800;
    }
    td, th {
      border-color: #dbe4ed !important;
      line-height: 1.55;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #f8fbff 0%, #eef3f8 100%);
    }
    body {
      padding: 30px;
    }
    @media (max-width: 760px) {
      body { padding: 18px; }
    }
  </style>
</head>
<body>

        <section class="slide">
          <div class="kicker">02 / SEGMENTATION</div>
          <h1>人群细分：6 大人群</h1>
          <p class="lead">先理解 6 大人群的差异，再看动机、使用、人口学、BTU 和痛点，有助于理解后续概念测试与潜在用户的相关内容。</p>
          <div class="grid three">
            <button class="jump-card" data-target="p021"><span>02.1</span><strong>6 个人群总览</strong><small>人群简介</small></button>
            <button class="jump-card" data-target="p022"><span>02.2</span><strong>使用场景：动机与触发</strong><small>使用动机、其他原因、需求/场景触发</small></button>
            <button class="jump-card" data-target="p023"><span>02.3</span><strong>使用场景：细节情况</strong><small>使用房间、户型风格、住房权属、使用经验等</small></button>
            <button class="jump-card" data-target="p024"><span>02.4</span><strong>人口学</strong><small>个人、家庭、职业等</small></button>
            <button class="jump-card" data-target="p025"><span>02.5</span><strong>BTU 建议</strong><small>不同人群的空间、面积、BTU 与适配关系。</small></button>
            <button class="jump-card" data-target="p026"><span>02.6</span><strong>人群痛点</strong><small>总痛点、排水和噪音延伸。</small></button>
          </div>
        </section>
        
  <script>
    document.querySelectorAll('[data-target]').forEach(function (el) {
      el.addEventListener('click', function (event) {
        var target = el.getAttribute('data-target');
        if (!target) return;
        event.preventDefault();
        if (window.parent && window.parent !== window) {
          window.parent.location.hash = encodeURIComponent(target);
        } else {
          window.location.hash = encodeURIComponent(target);
        }
      });
    });
  </script>
</body>
</html>
