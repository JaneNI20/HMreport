<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02.3_人群对比：使用情况</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f4f6f9;
      --paper:#ffffff;
      --paper-soft:#fbfcfe;
      --ink:#16202f;
      --ink-soft:#334155;
      --muted:#4b6075;
      --line:#d9e2ec;
      --line-strong:#c4d0dd;
      --shadow:0 16px 38px rgba(15, 23, 42, 0.08);
      --shadow-soft:0 10px 26px rgba(15, 23, 42, 0.06);
      --radius-xl:24px;
      --radius-lg:20px;
      --radius-md:16px;
      --radius-sm:12px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:linear-gradient(180deg, #f2f5f9 0%, #f6f8fb 100%);
      color:var(--ink);
      font-family:"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size:16px;
      line-height:1.6;
    }
    h1, h2, h3, h4, p { margin:0; }
    .wrap {
      max-width:1480px;
      margin:0 auto;
      padding:28px 24px 44px;
      display:grid;
      gap:24px;
    }
    .panel {
      background:var(--paper);
      border:1px solid rgba(217, 226, 236, 0.92);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:34px 38px;
      display:grid;
      gap:18px;
    }
    .hero {
      min-height:48vh;
      align-content:center;
      overflow:hidden;
      position:relative;
      background:
        radial-gradient(circle at top right, rgba(91,130,150,.10), transparent 28%),
        radial-gradient(circle at bottom left, rgba(47,67,90,.08), transparent 22%),
        linear-gradient(135deg, #ffffff 0%, #f8fbff 58%, #edf3fa 100%);
    }
    .hero::before,
    .hero::after {
      content:"";
      position:absolute;
      border-radius:999px;
      pointer-events:none;
    }
    .hero::before {
      width:300px;
      height:300px;
      right:-90px;
      top:-120px;
      background:radial-gradient(circle, rgba(91,130,150,.14), transparent 70%);
    }
    .hero::after {
      width:220px;
      height:220px;
      left:-50px;
      bottom:-120px;
      background:radial-gradient(circle, rgba(197,139,88,.14), transparent 72%);
    }
    .kicker {
      position:relative;
      z-index:1;
      font-size:13px;
      line-height:1;
      color:#6a7a8d;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-weight:800;
    }
    h1 {
      position:relative;
      z-index:1;
      max-width:960px;
      font-size:40px;
      line-height:1.14;
      letter-spacing:-0.02em;
    }
    .subtitle {
      position:relative;
      z-index:1;
      max-width:1080px;
      font-size:18px;
      line-height:1.8;
      color:var(--muted);
    }
    .hero-meta,
    .chip-row,
    .legend,
    .cluster-chip-list,
    .anchor-list,
    .selected-field-list {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .chip,
    .pill,
    .anchor-link {
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      padding:9px 13px;
      font-size:13px;
      line-height:1;
      color:#44596d;
      font-weight:700;
      text-decoration:none;
    }
    .anchor-link:hover {
      border-color:#9fb2c5;
      box-shadow:var(--shadow-soft);
    }
    .section-head {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-end;
    }
    .section-head h2 {
      font-size:31px;
      line-height:1.16;
      letter-spacing:-0.02em;
    }
    .section-head p {
      max-width:980px;
      font-size:16px;
      line-height:1.75;
      color:var(--muted);
    }
    .overview-grid {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:18px;
    }
    .cluster-card {
      border:1px solid var(--line);
      border-radius:22px;
      background:linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      padding:20px;
      display:grid;
      gap:13px;
      cursor:pointer;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      position:relative;
      overflow:hidden;
    }
    .cluster-card::before {
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:6px;
      background:var(--cluster-color, #94a3b8);
    }
    .cluster-card:hover {
      transform:translateY(-2px);
      box-shadow:0 14px 30px rgba(15, 23, 42, 0.08);
    }
    .cluster-card.active {
      border-color:var(--cluster-color, #94a3b8);
      box-shadow:0 18px 34px rgba(15, 23, 42, 0.10);
    }
    .cluster-top {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      padding-left:6px;
    }
    .cluster-name {
      font-size:23px;
      line-height:1.2;
      letter-spacing:-0.02em;
    }
    .cluster-long,
    .cluster-desc,
    .cluster-diff {
      font-size:14px;
      line-height:1.75;
      color:#52677a;
    }
    .cluster-sample {
      flex:0 0 auto;
      white-space:nowrap;
      padding:8px 10px;
      border-radius:14px;
      font-size:12px;
      font-weight:800;
      color:#243647;
      background:rgba(241, 245, 249, 0.92);
      border:1px solid rgba(203, 213, 225, 0.9);
    }
    .tag-row {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding-left:6px;
    }
    .tag {
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(243, 247, 251, 0.96);
      border:1px solid rgba(214, 223, 233, 0.96);
      color:#2b4155;
      font-size:12px;
      font-weight:800;
    }
    .mini-card {
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:14px 15px;
      margin-left:6px;
    }
    .mini-title {
      font-size:12px;
      line-height:1;
      color:#6d8194;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-weight:800;
      margin-bottom:8px;
    }
    .mini-list {
      display:grid;
      gap:6px;
      font-size:13px;
      line-height:1.65;
      color:#354b5f;
    }
    .jump-panel {
      position:sticky;
      top:12px;
      z-index:6;
      background:rgba(244, 246, 249, 0.90);
      backdrop-filter:blur(10px);
      border:1px solid rgba(217,226,236,.95);
      box-shadow:var(--shadow-soft);
    }
    .jump-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .jump-head h3 {
      font-size:24px;
      line-height:1.2;
    }
    .jump-head p {
      max-width:880px;
      font-size:15px;
      line-height:1.75;
      color:var(--muted);
    }
    .compare-layout {
      display:grid;
      grid-template-columns:minmax(320px, 420px) minmax(0, 1fr);
      gap:16px;
      align-items:start;
    }
    .control-card,
    .summary-card,
    .module-card,
    .chart-card,
    .detail-card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:var(--shadow-soft);
    }
    .control-card {
      padding:18px;
      display:grid;
      gap:14px;
    }
    .control-title {
      font-size:13px;
      line-height:1;
      color:#6c8094;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-weight:800;
    }
    .action-row {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .ghost-btn {
      appearance:none;
      border:1px solid var(--line-strong);
      background:#fff;
      border-radius:12px;
      padding:9px 12px;
      color:#41566a;
      font-size:13px;
      line-height:1;
      font-weight:700;
      cursor:pointer;
      transition:all .14s ease;
    }
    .ghost-btn:hover {
      border-color:#9eb0c3;
      box-shadow:var(--shadow-soft);
    }
    .chart-sort-btn.is-active {
      background:#2f6fa3;
      border-color:#2f6fa3;
      color:#fff;
    }
    .multi-list {
      display:grid;
      gap:10px;
    }
    .multi-option {
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:11px 12px;
      border:1px solid #e2e8f0;
      border-radius:14px;
      background:#fff;
    }
    .multi-option input { margin-top:3px; }
    .multi-option strong {
      display:block;
      font-size:14px;
      line-height:1.35;
      color:#283a4b;
    }
    .multi-option span {
      display:block;
      margin-top:4px;
      font-size:12px;
      line-height:1.6;
      color:#62778b;
    }
    .cluster-summary {
      display:grid;
      gap:12px;
      align-content:start;
    }
    .summary-strip {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    .summary-card {
      padding:16px;
    }
    .summary-value {
      font-size:31px;
      line-height:1;
      letter-spacing:-0.03em;
      font-weight:900;
      color:#1d3550;
    }
    .summary-label {
      margin-top:8px;
      font-size:12px;
      line-height:1;
      color:#6b8094;
      letter-spacing:.09em;
      text-transform:uppercase;
      font-weight:800;
    }
    .summary-desc {
      margin-top:8px;
      font-size:14px;
      line-height:1.7;
      color:#52677a;
    }
    .module-pages {
      display:grid;
      gap:24px;
    }
    .module-page-panel {
      display:grid;
      gap:18px;
    }
    .module-card {
      padding:24px;
      display:grid;
      gap:18px;
      background:linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
    }
    .module-head {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
    }
    .module-head h2 {
      font-size:30px;
      line-height:1.18;
      letter-spacing:-0.02em;
    }
    .module-head p {
      margin-top:8px;
      max-width:920px;
      font-size:16px;
      line-height:1.78;
      color:var(--muted);
    }
    .module-grid {
      display:grid;
      grid-template-columns:minmax(320px, 380px) minmax(0, 1fr);
      gap:16px;
      align-items:start;
    }
    .field-panel {
      display:grid;
      gap:14px;
      align-content:start;
    }
    .field-card {
      padding:18px;
    }
    .field-help {
      font-size:13px;
      line-height:1.7;
      color:#5b7186;
    }
    .field-pills {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .field-pill {
      display:inline-flex;
      align-items:center;
      min-height:32px;
      padding:8px 11px;
      border-radius:999px;
      background:#f8fafc;
      border:1px solid #dbe4ee;
      color:#364c60;
      font-size:12px;
      font-weight:700;
    }
    .field-multi-list {
      display:grid;
      gap:10px;
    }
    .field-multi-option {
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:11px 12px;
      border:1px solid #e2e8f0;
      border-radius:14px;
      background:#fff;
    }
    .field-multi-option input { margin-top:3px; }
    .field-multi-option strong {
      display:block;
      font-size:14px;
      line-height:1.35;
      color:#2b3d4e;
    }
    .field-multi-option span {
      display:block;
      margin-top:4px;
      font-size:12px;
      line-height:1.6;
      color:#62778b;
    }
    .charts-stack {
      display:grid;
      gap:18px;
      align-content:start;
    }
    .chart-card {
      padding:18px;
      display:grid;
      gap:14px;
      background:#fff;
    }
    .chart-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .chart-head-actions {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }
    .chart-head h4 {
      font-size:22px;
      line-height:1.2;
      letter-spacing:-0.02em;
    }
    .chart-head p {
      margin-top:6px;
      font-size:14px;
      line-height:1.7;
      color:#5c7287;
    }
    .legend-item {
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:8px 11px;
      border-radius:999px;
      background:#f7f9fc;
      border:1px solid var(--line);
      font-size:12px;
      line-height:1;
      font-weight:800;
      color:#44596d;
    }
    .swatch {
      width:10px;
      height:10px;
      border-radius:999px;
      display:inline-block;
    }
    .rows,
    .theme-summary-list {
      display:grid;
      gap:12px;
    }
    .theme-group {
      display:grid;
      gap:10px;
    }
    .theme-inline-detail {
      width:90%;
      margin-left:5%;
    }
    .cluster-toolbar-card {
      display:grid;
      gap:14px;
    }
    .cluster-inline-list {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:10px;
    }
    .row {
      display:grid;
      grid-template-columns:minmax(170px, 260px) minmax(0, 1fr);
      gap:14px;
      align-items:start;
    }
    .row-label {
      font-size:14px;
      line-height:1.6;
      color:#2b4054;
    }
    .bar-stack {
      display:grid;
      gap:7px;
    }
    .bar-line {
      display:grid;
      grid-template-columns:176px minmax(0, 1fr) 56px;
      gap:10px;
      align-items:center;
    }
    .bar-name {
      font-size:12px;
      line-height:1;
      color:#5f7488;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .bar-track {
      height:18px;
      background:#edf2f7;
      border-radius:999px;
      overflow:hidden;
    }
    .bar-fill {
      height:100%;
      border-radius:999px;
    }
    .bar-value {
      text-align:right;
      font-size:12px;
      line-height:1;
      color:#30495e;
      font-weight:800;
    }

    .field-insight {
      margin-top:10px;
      padding:10px 12px;
      border:1px solid #dbe5ee;
      border-radius:8px;
      background:#f8fbfd;
    }
    .field-insight summary {
      cursor:pointer;
      list-style:none;
      font-size:12px;
      line-height:1.4;
      font-weight:800;
      color:#263f57;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .field-insight summary::-webkit-details-marker {
      display:none;
    }
    .field-insight summary::after {
      content:"收起";
      font-size:11px;
      color:#71869a;
      font-weight:700;
    }
    .field-insight:not([open]) summary::after {
      content:"展开";
    }
    .field-insight-body {
      display:grid;
      gap:8px;
      margin-top:8px;
      font-size:12px;
      line-height:1.65;
      color:#40586f;
    }
    .field-insight-body p {
      margin:0;
    }
    .field-instruction-card,
    .field-summary-card {
      background:linear-gradient(180deg,#ffffff 0%,#f7fbff 100%);
    }
    .field-summary-card .summary-line {
      color:#294057;
      font-size:14px;
      line-height:1.75;
      font-weight:700;
    }
    .tgi-tag {
      display:inline-block;
      min-width:62px;
      margin-right:6px;
      padding:2px 5px;
      border-radius:5px;
      background:#fff3da;
      color:#8a4b00;
      font-size:11px;
      line-height:1.15;
      font-weight:800;
      vertical-align:middle;
    }
    .theme-summary {
      width:100%;
      border:1px solid #dfe7f0;
      border-radius:16px;
      background:#fcfdff;
      padding:14px;
      text-align:left;
      cursor:pointer;
      transition:all .14s ease;
    }
    .theme-summary:hover {
      border-color:#b9c8d8;
      box-shadow:var(--shadow-soft);
    }
    .theme-summary.active {
      border-color:#7f99b3;
      background:#f8fbfe;
      box-shadow:var(--shadow-soft);
    }
    .theme-summary-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:6px;
    }
    .theme-summary-title {
      font-size:16px;
      line-height:1.35;
      font-weight:800;
      color:#213446;
    }
    .theme-summary-meta {
      flex:0 0 auto;
      font-size:12px;
      line-height:1;
      color:#61778b;
      font-weight:700;
      white-space:nowrap;
    }
    .theme-summary-desc {
      font-size:13px;
      line-height:1.7;
      color:#607487;
      margin-bottom:10px;
    }
    .detail-card {
      padding:16px;
      background:#ffffff;
      display:grid;
      gap:12px;
    }
    .detail-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .detail-head h5 {
      font-size:18px;
      line-height:1.25;
      margin:0;
    }
    .detail-head p {
      margin-top:5px;
      font-size:14px;
      line-height:1.7;
      color:#5c7185;
    }
    .detail-badge {
      flex:0 0 auto;
      border-radius:999px;
      padding:8px 10px;
      background:#f4f7fa;
      border:1px solid var(--line);
      color:#41586c;
      font-size:12px;
      line-height:1;
      font-weight:800;
      white-space:nowrap;
    }
    .empty {
      padding:22px;
      border:1px dashed #c6d3df;
      border-radius:18px;
      background:#f8fbfe;
      color:#5f7488;
      font-size:14px;
      line-height:1.8;
    }
    .footnote {
      font-size:12px;
      line-height:1.8;
      color:#6b8194;
    }
    @media (max-width:1220px) {
      .overview-grid,
      .compare-layout,
      .module-grid,
      .summary-strip,
      .cluster-inline-list {
        grid-template-columns:1fr;
      }
      .jump-panel { position:static; }
    }
    @media (max-width:860px) {
      .wrap { padding:16px 14px 32px; }
      .panel { padding:24px 18px; }
      h1 { font-size:32px; }
      .section-head,
      .module-head,
      .jump-head,
      .chart-head,
      .detail-head {
        display:grid;
      }
      .row {
        grid-template-columns:1fr;
      }
      .bar-line {
        grid-template-columns:136px minmax(0, 1fr) 48px;
      }
    }
  </style>

    const els = {
      modulePages: document.getElementById('modulePages'),
    };

    function selectedClusters(pageId) {
      const selected = state.selectedClustersByPage[pageId] || new Set();
      return clusterOrder.filter(name => selected.has(name));
    }

    function selectedFields(page) {
      const selected = state.selectedFieldsByPage[page.id] || new Set();
      return page.field_keys.filter(key => selected.has(key));
    }

    function clusterColor(name) {
      return (report.clusterColors || {})[name] || '#94a3b8';
    }

    function avgAcrossClusters(values, clusters) {
      if (!clusters.length) return 0;
      return clusters.reduce((sum, cluster) => sum + (values[cluster] || 0), 0) / clusters.length;
    }

    function formatPct(value) {
      return `${Math.round((value || 0) * 100)}%`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatInsightLine(value) {
      return escapeHtml(value)
        .replace(/&lt;strong&gt;/g, '<strong>')
        .replace(/&lt;\/strong&gt;/g, '</strong>')
        .replace(/&lt;br&gt;/g, '<br>')
        .replace(/&lt;br\s*\/&gt;/g, '<br>');
    }
    function toggleCluster(pageId, name) {
      const next = new Set(state.selectedClustersByPage[pageId] || []);
      if (next.has(name)) next.delete(name); else next.add(name);
      state.selectedClustersByPage[pageId] = next;
      render();
    }

    function setPageClusters(pageId, names) {
      state.selectedClustersByPage[pageId] = new Set(names);
      render();
    }

    function toggleField(pageId, key) {
      const next = new Set(state.selectedFieldsByPage[pageId] || []);
      if (next.has(key)) next.delete(key); else next.add(key);
      state.selectedFieldsByPage[pageId] = next;
      render();
    }

    function setPageFields(pageId, keys) {
      state.selectedFieldsByPage[pageId] = new Set(keys);
      render();
    }

    function themeStateKey(pageId, fieldKey) {
      return `${pageId}::${fieldKey}`;
    }

    function fieldSortStateKey(pageId, fieldKey) {
      return `${pageId}::${fieldKey}`;
    }

    function fieldSortMode(pageId, fieldKey) {
      return state.sortModeByField[fieldSortStateKey(pageId, fieldKey)] || 'natural';
    }

    function toggleFieldSort(pageId, fieldKey) {
      const key = fieldSortStateKey(pageId, fieldKey);
      state.sortModeByField[key] = fieldSortMode(pageId, fieldKey) === 'value' ? 'natural' : 'value';
      render();
    }

    function setExpandedTheme(pageId, fieldKey, themeKey) {
      const key = themeStateKey(pageId, fieldKey);
      state.expandedThemesByPage[key] = state.expandedThemesByPage[key] === themeKey ? null : themeKey;
      render();
    }
    function orderedPlainOptions(pageId, field, clusters) {
      let options = (field.options || []).slice();
      if (Array.isArray(field.order) && field.order.length) {
        const rank = label => {
          const index = field.order.indexOf(label);
          return index === -1 ? 999 : index;
        };
        options.sort((a, b) => rank(a.label) - rank(b.label));
      }
      if (field.limit) options = options.slice(0, field.limit);
      return options;
    }

    function orderedThemes(field, clusters) {
      return (field.themes || []).slice().sort((a, b) => avgAcrossClusters(b.avgValues, clusters) - avgAcrossClusters(a.avgValues, clusters)).map(theme => ({
        ...theme,
        items: theme.items.slice().sort((a, b) => avgAcrossClusters(b.values, clusters) - avgAcrossClusters(a.values, clusters)),
      }));
    }

          </div>
          <div class="module-card">
            <div class="module-grid">
              <aside class="field-panel">
                <div class="control-card">
                  <div class="control-title">选择字段</div>
                  <div class="action-row">
                    <button class="ghost-btn" type="button" data-action="defaults" data-page="${escapeHtml(page.id)}">恢复本页推荐</button>
                    <button class="ghost-btn" type="button" data-action="all" data-page="${escapeHtml(page.id)}">全选本页字段</button>
                    <button class="ghost-btn" type="button" data-action="clear" data-page="${escapeHtml(page.id)}">清空本页字段</button>
                  </div>
                  
                  <div class="field-multi-list">
                    ${page.field_keys.map(key => `
                      <label class="field-multi-option">
                        <input type="checkbox" value="${escapeHtml(key)}" data-page-field="${escapeHtml(page.id)}" ${fields.includes(key) ? 'checked' : ''} />
                        <div>
                          <strong>${escapeHtml(fieldMap[key].title)}</strong>
                          ${fieldMap[key].mode === 'theme' ? '<span>按 theme 再展开细项</span>' : ''}
                        </div>
                      </label>
                    `).join('')}
                  </div>
                </div>
                ${page.id === 'page-usage' ? `<div class="control-card field-summary-card"><div class="control-title">核心结论</div><div class="summary-line">🚩家庭健康守护型、便捷安居实用型、空间自主掌控型更偏大户型、自有房、主卧/客厅和成熟使用市场；有限空间平衡型和局部速冷控温型更偏小户型、公寓、租房和较新的增长机会，而理性应急准备型则是一个偏大户型、以关键时刻可靠为核心的中间型人群。</div></div>` : ''}
              </aside>
              <div class="charts-stack">
                <div class="control-card cluster-toolbar-card">
                  <div class="control-title">选择人群</div>
                  <div class="action-row">
                    <button class="ghost-btn" type="button" data-cluster-action="defaults" data-page="${escapeHtml(page.id)}">恢复本页推荐</button>
                    <button class="ghost-btn" type="button" data-cluster-action="all" data-page="${escapeHtml(page.id)}">全选</button>
                    <button class="ghost-btn" type="button" data-cluster-action="clear" data-page="${escapeHtml(page.id)}">清空</button>
                  </div>
                  <div class="field-help">可多选群体进行对比。</div>
                  <div class="cluster-inline-list">
                    ${report.clusterMeta.map(metaItem => `
                      <label class="field-multi-option">
                        <input type="checkbox" value="${escapeHtml(metaItem.name)}" data-page-cluster="${escapeHtml(page.id)}" ${clusters.includes(metaItem.name) ? 'checked' : ''} />
                        <div>
                          <strong>${escapeHtml(metaItem.name)}</strong>
                          <span>${escapeHtml(metaItem.shortLabel)} / n=${metaItem.sampleSize} / ${escapeHtml(metaItem.sampleShare)}</span>
                        </div>
                      </label>
                    `).join('')}
                  </div>
                </div>
                ${['page-usage', 'page-demo'].includes(page.id) ? `<div class="control-card field-instruction-card"><div class="control-title">排序说明</div><div class="field-help">默认按固定人群顺序展示，右上角“排序”可使人群条形按占比从大到小展示</div></div>` : ''}
                ${boardHtml}
                ${['page-usage', 'page-demo'].includes(page.id) ? '' : `<div class="footnote">说明：默认按字段自然顺序展示，点击每张图右上角“排序”可切换为按当前选中人群平均占比降序；教育程度、职业领域、所在州默认只显示前 10 项。</div>`}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderModulePages() {
      els.modulePages.innerHTML = visiblePages.map(renderModulePage).join('');
      Array.from(els.modulePages.querySelectorAll('input[data-page-cluster]')).forEach(input => {
        input.addEventListener('change', () => toggleCluster(input.getAttribute('data-page-cluster'), input.value));
      });
      Array.from(els.modulePages.querySelectorAll('input[data-page-field]')).forEach(input => {
        input.addEventListener('change', () => toggleField(input.getAttribute('data-page-field'), input.value));
      });
      Array.from(els.modulePages.querySelectorAll('button[data-cluster-action]')).forEach(button => {
        button.addEventListener('click', () => {
          const pageId = button.getAttribute('data-page');
          const action = button.getAttribute('data-cluster-action');
          if (action === 'defaults') setPageClusters(pageId, [report.clusters[0].name]);
          if (action === 'all') setPageClusters(pageId, clusterOrder);
          if (action === 'clear') setPageClusters(pageId, []);
        });
      });
      Array.from(els.modulePages.querySelectorAll('button[data-action]')).forEach(button => {
        button.addEventListener('click', () => {
          const pageId = button.getAttribute('data-page');
          const page = report.pages.find(item => item.id === pageId);
          const action = button.getAttribute('data-action');
          if (action === 'defaults') setPageFields(pageId, page.default_fields);
          if (action === 'all') setPageFields(pageId, page.field_keys);
          if (action === 'clear') setPageFields(pageId, []);
        });
      });
      Array.from(els.modulePages.querySelectorAll('.theme-summary')).forEach(button => {
        button.addEventListener('click', () => setExpandedTheme(button.getAttribute('data-page'), button.getAttribute('data-field'), button.getAttribute('data-theme')));
      });
      Array.from(els.modulePages.querySelectorAll('button[data-sort-page]')).forEach(button => {
        button.addEventListener('click', () => toggleFieldSort(button.getAttribute('data-sort-page'), button.getAttribute('data-sort-field')));
      });
    }

    function render() {
      renderModulePages();
    }
    render();
  </script>
</body>
</html>
