    .wrap { max-width: 1500px; margin: 0 auto; padding: 24px; }

    .kicker { font-size:14px; color:#64748b; text-transform:uppercase; letter-spacing:.08em; }
    h1 { margin:0; font-size:34px; line-height:1.2; }
    .subtitle { color:#475569; font-size:17px; line-height:1.6; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; }

    .summary { font-size:14px; color:#475569; }
    .charts { display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:16px; }
    .chartPanel { border:1px solid #dbe3ee; border-radius:16px; padding:16px; background:#fcfdff; min-width:0; }
    .chartPanel h3 { margin:0 0 10px 0; font-size:18px; }
    .chart { display:flex; flex-direction:column; gap:10px; }
    .row { display:grid; grid-template-columns: minmax(140px, 240px) minmax(120px, 1fr) 56px; gap:10px; align-items:center; }
    .name { font-size:12px; word-break:break-word; cursor:pointer; line-height:1.4; }
    .barwrap { height:22px; background:#eef2f7; border-radius:999px; overflow:hidden; min-width:0; }
    .bar { height:100%; border-radius:999px; }
    .value { text-align:right; font-weight:700; color:#1d4ed8; font-size:12px; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; }
    .legend span { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:10px; height:10px; border-radius:999px; display:inline-block; }
    .detailWrap { display:flex; gap:18px; flex-wrap:wrap; }
    .detail { margin-top:14px; padding:14px; border:1px solid #dbe3ee; border-radius:14px; background:#f8fafc; min-width:340px; flex:1; }
    .detail h4 { margin:0 0 8px 0; font-size:16px; }
    .detail p { margin:0 0 10px 0; line-height:1.6; color:#475569; }
    .detail .small { font-size:13px; color:#64748b; margin:3px 0; }
    .takeaway { background:#eef6ff; border-left:5px solid #3b82f6; border-radius:12px; padding:14px 16px; line-height:1.7; font-size:15px; }

    .summary-line-wrap { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .summary-line-wrap .sort-note { margin-left:auto; color:#64748b; font-size:12px; font-weight:700; line-height:1.5; }

  <script>
    const palette = { '主要原因（动机）':'#1d4ed8', '其他原因':'#8b5cf6', '使用场景':'#f59e0b' };
    const userOrder = ['现有用户','潜在用户'];
    const sizeOrder = ['大户型','小户型'];
    const roomOrder = ['主卧','客厅','次卧'];
    const moduleOrder = ['主要原因（动机）','其他原因','使用场景'];
    function isHiddenRow(row) {
      const label = String(row.display_label || row.label || '').trim().toLowerCase();
      return label === 'other' || label === '以上皆无' || label === 'none of them';
    }
    const groupSelectionOrder = [];
    function updateGroupSelectionOrder(input) {
      const value = input.value;
      const index = groupSelectionOrder.indexOf(value);
      if (input.checked && index === -1) groupSelectionOrder.push(value);
      if (!input.checked && index !== -1) groupSelectionOrder.splice(index, 1);
    }
    function getChecked(selector, order, useSelectionOrder = false) {
      const checked = Array.from(document.querySelectorAll(selector)).filter(x => x.checked).map(x => x.value);
      if (!useSelectionOrder) return checked.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
      const selected = groupSelectionOrder.filter(value => checked.includes(value));
      const rest = checked.filter(value => !selected.includes(value)).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
      return selected.concat(rest);
    }
    function rowKey(row) { return [row.module, row.theme || '', row.display_label || row.label || ''].join('||'); }
    function buildLegend() { document.getElementById('legend').innerHTML = Object.entries(palette).map(([k,v]) => `<span><i class="dot" style="background:${v}"></i>${k}</span>`).join(''); }
    function getSelectedGroups() { const selected=[...getChecked('.userFilter', userOrder, true), ...getChecked('.sizeFilter', sizeOrder, true), ...getChecked('.roomFilter', roomOrder, true)]; if (selected.length) return selected; return document.getElementById('overall').checked ? ['整体'] : []; }
    function render() {
      const groups = getSelectedGroups();
      const modules = getChecked('.moduleFilter', moduleOrder);
      document.getElementById('summary').innerHTML = `<div class="summary-line-wrap"><span>当前展示群体：${groups.join('、')} ｜ 当前模块：${modules.join('、')}</span><span class="sort-note">注：排序以第一个选择的群组为基准，其他群组保持相同顺序，仅更新对应占比。</span></div>`;
      const charts = document.getElementById('charts'); const details = document.getElementById('details'); charts.innerHTML=''; details.innerHTML='';
      const primary = groups[0] || '整体';
      const baseRows = window.motivationModuleData.chart_rows.filter(r => r.group===primary && modules.includes(r.module) && !isHiddenRow(r)).sort((a,b)=>Number(b.value || 0)-Number(a.value || 0)).slice(0,12);
      groups.forEach(group => {
        const rawRows = window.motivationModuleData.chart_rows.filter(r => r.group===group && modules.includes(r.module) && !isHiddenRow(r));
        const rawMap = new Map(rawRows.map(r => [rowKey(r), r]));
        const rows = baseRows.map(base => rawMap.get(rowKey(base)) || {...base, group, value:0});
        const max = Math.max(...rows.map(r => Number(r.value)||0), 100);
        const panel = document.createElement('div'); panel.className='chartPanel'; panel.innerHTML=`<h3>${group}</h3><div class="chart"></div>`;
        const chart = panel.querySelector('.chart');
        rows.forEach(r => {
          const color = palette[r.module] || '#94a3b8';
          const row = document.createElement('div'); row.className='row';
          row.innerHTML = `<div class="name" style="color:${color}; cursor:${r.module !== '主要原因（动机）' ? 'pointer' : 'default'}">${r.display_label || r.label}</div><div class="barwrap"><div class="bar" style="width:${(r.value/max)*100}%;background:${color}"></div></div><div class="value">${Number(r.value).toFixed(1)}</div>`;
          if (r.module !== '主要原因（动机）') row.querySelector('.name').addEventListener('click', () => showDetail(groups, group, r));
          chart.appendChild(row);
        });
        charts.appendChild(panel);
      });
    }
    function showDetail(groups, clickedGroup, rowInfo) {
      const details = document.getElementById('details'); details.innerHTML='';
      groups.forEach(group => {
        const sub = window.motivationModuleData.detail_rows.filter(r => r.group===group && r.module===rowInfo.module && r.theme===rowInfo.theme).sort((a,b)=>b.value-a.value);
        if (!sub.length) return;
        const box = document.createElement('div'); box.className='detail';
        box.innerHTML = `<h4>${group}｜${rowInfo.label}</h4><p>${rowInfo.theme_desc || sub[0].theme_desc || '该主题为一组动机/场景的归并。'}</p>`;
        sub.forEach(x => { const line = document.createElement('div'); line.className='small'; line.textContent = `${x.label}：${x.value.toFixed(1)}%`; box.appendChild(line); });
        details.appendChild(box);
      });
    }
    buildLegend();
    document.getElementById('overall').addEventListener('change', render);
    document.querySelectorAll('.userFilter,.sizeFilter,.roomFilter').forEach(el => el.addEventListener('change', () => { updateGroupSelectionOrder(el); render(); }));
    document.querySelectorAll('.moduleFilter').forEach(el => el.addEventListener('change', render));
    render();
  </script>
